name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Override Python version
        run: mise use python@${{ matrix.python-version }}

      - name: Install dependencies
        run: mise run setup

      - name: Lint
        run: mise run lint

      - name: Type check
        run: mise run typecheck

      - name: Test
        run: mise run test

  # Single required status check for the ruleset, independent of the matrix.
  check-gate:
    name: check
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success

  live-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Install dependencies
        run: mise run setup

      - name: Live smoke tests (real server + real APIs)
        run: mise run test:live
        env:
          MTG_MCP_TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Build package
        run: uv build

      - name: Verify package installs and imports
        run: uv run --with dist/*.whl --no-project -- python -c "from mtg_mcp_server import __version__; print(f'mtg-mcp-server {__version__}')"

      - name: Verify entry point
        run: uv run --with dist/*.whl --no-project -- mtg-mcp-server --help 2>&1

      - name: Verify MCP tool registration
        run: |
          uv run --with dist/*.whl --no-project -- python -c "
          import asyncio
          from fastmcp import Client
          from mtg_mcp_server.server import mcp

          async def check():
              async with Client(transport=mcp) as c:
                  tools = await c.list_tools()
                  print(f'Registered {len(tools)} tools:')
                  for t in sorted(tools, key=lambda t: t.name):
                      print(f'  {t.name}')
                  assert len(tools) >= 20, f'Expected 20+ tools, got {len(tools)}'
          asyncio.run(check())
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Install dependencies
        run: mise run setup

      - name: Audit dependencies
        run: uv run pip-audit
